# 브레이크타임 설정값. 값마다 단위를 주석으로 함께 적는다.
# 임계값은 개발용 영상으로만 조정한다 (평가용 영상을 보고 바꾸지 않는다).

paths:
  yolo_weights: yolov8n.pt  # 사전학습 YOLO 가중치. 파일 이름만 쓰면 처음 실행 때 자동으로 받음 (커밋 금지)
  output_dir: outputs                     # 결과 JSON·디버그 영상 저장 폴더 (커밋 금지)

perception:
  conf_threshold: 0.3      # YOLO 검출 신뢰도 최소값 (0~1)
  tracker: bytetrack.yaml  # Ultralytics에 들어 있는 ByteTrack 설정 파일 이름
  nms_iou: 0.5            # 겹친 박스 중복 제거 기준 (0~1). 낮을수록 많이 지운다 (Ultralytics 기본 0.7)
  # 카메라마다 다른 값. 기본값은 평균적인 값이고, 카메라별 설정 파일(configs/*.yaml, --camera)로 덮어쓴다
  hood_ratio: 0.2             # 화면 아래 본넷이 차지하는 높이 비율 (0~1). 이 아래는 검출에서 잘라낸다
  center_x_ratio: 0.5         # 내 차가 향하는 정면의 x / 화면 너비 (0~1). 0.5는 화면 중앙
  car_width_m: 1.8            # 앞차 실제 폭 가정 (m). 옆 거리 계산에 쓴다
  lane_half_width_m: 1.7      # 내 차선 반폭 (m). 정면에서 옆으로 이 안에 있는 차가 앞차 후보
  cut_in_frames: 5            # 끼어들기 판단 연속 프레임 수 N (프레임)
  cut_in_zone_m: 2.0          # 차선 바깥 이 거리(m) 안에 있는 차만 끼어들기 후보
  cut_in_move_m: 0.3          # N프레임 동안 차선 안쪽으로 이만큼(m) 이상 다가와야 끼어들기
  cut_in_min_box_w_px: 40     # 박스 폭이 이보다 작은 먼 차는 끼어들기 판단에서 뺀다 (px). 폭이 작으면 옆 거리가 크게 흔들린다
