# [이전 방식 백업] blackbox_2.mp4 카메라 설정. config.yaml의 perception 값 중 이 카메라에서 다른 것만 적는다.
# 사다리꼴 방식을 쓸 때의 값이다. 지금 파이프라인은 사다리꼴을 쓰지 않아서 이 파일은 읽히지 않는다.
# 자동 보정은 이 영상에서 실패한다 (차선 조각 220개, 소실점 후보 지지 50개 미만).
# 사다리꼴은 사용자가 프레임 5에서 직접 그린 내 차선을 비율로 옮긴 값이다 (영상 처음 구간 기준).

auto_lane: false   # 자동 보정을 끄고 아래 값을 그대로 쓴다
hood_ratio: 0.15   # 화면 아래 본넷 높이 비율 (0~1). 흰 본넷이 y≈0.85에서 시작한다
# 순서: 왼쪽 위 → 오른쪽 위 → 오른쪽 아래 → 왼쪽 아래. 화면 너비·높이에 대한 비율 (0~1)
lane_trapezoid:
  - [0.169, 0.58]
  - [0.278, 0.58]
  - [0.512, 0.82]
  - [0.0, 0.82]
